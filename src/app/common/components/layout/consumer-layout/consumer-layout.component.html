<div class="flex h-screen bg-base overflow-hidden relative text-[rgb(var(--color-text))]">
  
  @let config = (whiteLabelConfig$ | async);

  <!-- TOP NAVBAR FOR CONSUMER APP -->
  <header class="fixed top-0 left-0 w-full h-20 bg-surface/80 backdrop-blur-xl border-b border-white/5 z-40 flex items-center px-6 shadow-2xl">
    <div class="flex items-center gap-3 mr-8 min-w-max">
      <img *ngIf="config?.logoUrl" [src]="config?.logoUrl" class="h-8 w-auto" alt="Logo">
      <span class="text-lg font-black text-[rgb(var(--color-primary))] tracking-tighter uppercase leading-none">{{ config?.appName }}</span>
    </div>
    
    <nav class="flex items-center gap-1 overflow-x-auto no-scrollbar flex-grow py-2">
      <a routerLink="/consumer-app/dashboard" routerLinkActive="bg-white/10 text-[rgb(var(--color-primary))]" class="px-4 py-2 rounded-2xl text-sm font-black uppercase tracking-widest text-gray-400 hover:text-white transition-all whitespace-nowrap">
        {{ i18nService.translate('COMMON.HOME') }}
      </a>
      @for (item of userMenuItems$ | async; track item.id) {
        <a [routerLink]="['/consumer-app/records', item.entityKey]" routerLinkActive="bg-white/10 text-[rgb(var(--color-primary))]" class="px-4 py-2 rounded-2xl text-sm font-black uppercase tracking-widest text-gray-400 hover:text-white transition-all whitespace-nowrap flex items-center gap-2">
          @if (item.icon && item.icon.startsWith('fa-')) {
            <i class="fa-solid {{ item.icon }} text-xs"></i>
          }
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-4">
      <!-- Selettore Lingua -->
      <div class="flex gap-2 bg-black/20 p-1 rounded-xl border border-white/5">
        <button (click)="setLang('it')" class="w-6 h-6 flex items-center justify-center rounded-lg transition-all" [class.bg-white/10]="(i18nService.currentLang$ | async) === 'it'">
          <span class="text-xs">🇮🇹</span>
        </button>
        <button (click)="setLang('en')" class="w-6 h-6 flex items-center justify-center rounded-lg transition-all" [class.bg-white/10]="(i18nService.currentLang$ | async) === 'en'">
          <span class="text-xs">🇬🇧</span>
        </button>
      </div>

      <!-- User Profile & Logout -->
      <button (click)="logout()" class="p-2 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all border border-red-500/20">
        <i class="fa-solid fa-right-from-bracket text-xs"></i>
      </button>
    </div>
  </header>

  <!-- AREA CONTENUTO PRINCIPALE -->
  <div class="flex-1 flex flex-col pt-20 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-[rgb(var(--color-bg-base))] via-[rgb(var(--color-bg-base))] to-[rgb(var(--color-primary)/0.05)] -z-10"></div>
    <main class="flex-1 overflow-y-auto scroll-smooth animate-soft-in">
      <div class="container mx-auto p-6 md:p-10 min-h-full text-[rgb(var(--color-text))]">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
